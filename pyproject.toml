[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-transcript"
version = "0.1.0"
description = "Self-hosted, mobile-friendly YouTube transcript tool with playlist support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2025.1.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
yt-transcript = "yt_transcript.cli:main"

[tool.setuptools]
packages = ["yt_transcript"]

[tool.setuptools.package-data]
yt_transcript = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
